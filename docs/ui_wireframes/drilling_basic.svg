<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe Basic cho Drilling HMS</title>
  <desc id="desc">Editor Drilling theo dependency cycle; Peck depth chỉ hiện khi cycle peck được chọn.</desc>
  <defs><style>
    .bg{fill:#f3f5f7}.surface{fill:#fff;stroke:#c6cdd5}.bar{fill:#e9edf2;stroke:#c6cdd5}.soft{fill:#e8f1fb;stroke:#8db4db}.ok{fill:#e7f5ed;stroke:#4b9a6c}.text{font:14px 'Segoe UI',Arial,sans-serif;fill:#202a33}.small{font:12px 'Segoe UI',Arial,sans-serif;fill:#5c6874}.label{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#202a33}.button{fill:#fff;stroke:#9ca8b4}.primary{fill:#2463a5}.white{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#fff}
  </style></defs>
  <rect class="bg" width="760" height="900"/><rect class="surface" x="18" y="16" width="724" height="868" rx="6"/>
  <rect class="ok" x="34" y="34" width="692" height="76" rx="5"/><text class="label" x="52" y="64">Drilling lỗ gá</text><text class="small" x="52" y="90">READY · 8 lỗ · Drill D6 · Cycle peck</text>
  <rect class="surface" x="34" y="124" width="692" height="430" rx="5"/><text class="label" x="52" y="154">Basic · 6 input + 1 dependency</text>
  <text class="small" x="52" y="194">1. Hole Pattern</text><rect class="soft" x="240" y="174" width="454" height="34" rx="4"/><text class="text" x="254" y="197">8 lỗ · Ø6.0 · hướng +Z</text>
  <text class="small" x="52" y="240">2. Drill Tool</text><rect class="button" x="240" y="220" width="454" height="34" rx="4"/><text class="text" x="254" y="243">Mũi khoan D6 · Holder DR01</text>
  <text class="small" x="52" y="286">3. Chiều sâu</text><rect class="button" x="240" y="266" width="356" height="34" rx="4"/><text class="text" x="254" y="289">22.000</text><text class="small" x="610" y="289">mm</text>
  <text class="small" x="52" y="332">4. Cycle</text><rect class="button" x="240" y="312" width="454" height="34" rx="4"/><text class="text" x="254" y="335">Peck drilling</text>
  <rect class="soft" x="226" y="356" width="482" height="54" rx="4"/><text class="small" x="242" y="378">Peck depth · chỉ hiện vì Cycle = Peck</text><text class="text" x="548" y="395">3.000 mm</text>
  <text class="small" x="52" y="444">5. Lượng chạy dao</text><rect class="button" x="240" y="424" width="356" height="34" rx="4"/><text class="text" x="254" y="447">180</text><text class="small" x="610" y="447">mm/min</text>
  <text class="small" x="52" y="490">6. Tốc độ trục chính</text><rect class="button" x="240" y="470" width="356" height="34" rx="4"/><text class="text" x="254" y="493">3200</text><text class="small" x="610" y="493">rpm</text>
  <text class="small" x="52" y="536">Top/clearance/retract từ Geometry và Setup 1</text>
  <rect class="bar" x="34" y="568" width="692" height="48" rx="4"/><text class="text" x="52" y="598">Geometry · 8 lỗ, current</text><text class="text" x="696" y="598">›</text>
  <rect class="bar" x="34" y="626" width="692" height="48" rx="4"/><text class="text" x="52" y="656">Levels / Safe Motion · dùng giá trị Setup</text><text class="text" x="696" y="656">›</text>
  <rect class="bar" x="34" y="684" width="692" height="48" rx="4"/><text class="text" x="52" y="714">Advanced · Dwell, Retract policy · collapsed</text><text class="text" x="696" y="714">›</text>
  <rect class="bar" x="34" y="742" width="692" height="48" rx="4"/><text class="text" x="52" y="772">Expert · Geometry tolerance · collapsed</text><text class="text" x="696" y="772">›</text>
  <rect class="button" x="34" y="818" width="100" height="38" rx="4"/><text class="small" x="50" y="842">Reset Draft</text><rect class="button" x="144" y="818" width="84" height="38" rx="4"/><text class="small" x="163" y="842">Preview</text><rect class="button" x="238" y="818" width="84" height="38" rx="4"/><text class="small" x="256" y="842">Validate</text><rect class="primary" x="332" y="818" width="96" height="38" rx="4"/><text class="white" x="351" y="842">Calculate</text><rect class="button" x="438" y="818" width="74" height="38" rx="4"/><text class="small" x="459" y="842">Apply</text><rect class="button" x="522" y="818" width="74" height="38" rx="4"/><text class="small" x="542" y="842">Close</text>
</svg>
