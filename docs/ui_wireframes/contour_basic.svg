<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe Basic cho Contour HMS</title>
  <desc id="desc">Editor Contour chỉ hiện bảy input cốt lõi, geometry và tool summary, Advanced collapsed.</desc>
  <defs><style>
    .bg{fill:#f3f5f7}.surface{fill:#fff;stroke:#c6cdd5}.bar{fill:#e9edf2;stroke:#c6cdd5}.soft{fill:#e8f1fb;stroke:#8db4db}.ok{fill:#e7f5ed;stroke:#4b9a6c}.text{font:14px 'Segoe UI',Arial,sans-serif;fill:#202a33}.small{font:12px 'Segoe UI',Arial,sans-serif;fill:#5c6874}.label{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#202a33}.button{fill:#fff;stroke:#9ca8b4}.primary{fill:#2463a5}.white{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#fff}
  </style></defs>
  <rect class="bg" width="760" height="900"/>
  <rect class="surface" x="18" y="16" width="724" height="868" rx="6"/>
  <rect class="ok" x="34" y="34" width="692" height="76" rx="5"/>
  <text class="label" x="52" y="64">Contour ngoài</text><text class="small" x="52" y="90">READY · Profile kín · Dao D10 · 0 lỗi</text>
  <rect class="surface" x="34" y="124" width="692" height="430" rx="5"/>
  <text class="label" x="52" y="154">Basic · 7 input</text>
  <text class="small" x="52" y="194">1. Profile</text><rect class="soft" x="240" y="174" width="454" height="34" rx="4"/><text class="text" x="254" y="197">Biên dạng ngoài · kín · Focus trong viewport</text>
  <text class="small" x="52" y="240">2. Tool Assembly</text><rect class="button" x="240" y="220" width="454" height="34" rx="4"/><text class="text" x="254" y="243">Dao phay ngón D10 · Holder H01</text>
  <text class="small" x="52" y="286">3. Side</text><rect class="button" x="240" y="266" width="454" height="34" rx="4"/><text class="text" x="254" y="289">Bên ngoài</text>
  <text class="small" x="52" y="332">4. Chiều sâu cuối</text><rect class="button" x="240" y="312" width="356" height="34" rx="4"/><text class="text" x="254" y="335">-12.000</text><text class="small" x="610" y="335">mm</text>
  <text class="small" x="52" y="378">5. Bước xuống</text><rect class="button" x="240" y="358" width="356" height="34" rx="4"/><text class="text" x="254" y="381">2.000</text><text class="small" x="610" y="381">mm</text>
  <text class="small" x="52" y="424">6. Lượng chạy dao</text><rect class="button" x="240" y="404" width="356" height="34" rx="4"/><text class="text" x="254" y="427">650</text><text class="small" x="610" y="427">mm/min</text>
  <text class="small" x="52" y="470">7. Tốc độ trục chính</text><rect class="button" x="240" y="450" width="356" height="34" rx="4"/><text class="text" x="254" y="473">4800</text><text class="small" x="610" y="473">rpm</text>
  <text class="small" x="52" y="522">Top Z: 0.000 mm từ Geometry · Clearance/Retract từ Setup 1</text>
  <rect class="bar" x="34" y="568" width="692" height="48" rx="4"/><text class="text" x="52" y="598">Geometry · Profile kín, mặt phẳng XY</text><text class="text" x="696" y="598">›</text>
  <rect class="bar" x="34" y="626" width="692" height="48" rx="4"/><text class="text" x="52" y="656">Cutting · Direction, Allowance, Finishing pass</text><text class="text" x="696" y="656">›</text>
  <rect class="bar" x="34" y="684" width="692" height="48" rx="4"/><text class="text" x="52" y="714">Levels / Linking · giá trị kế thừa đang dùng</text><text class="text" x="696" y="714">›</text>
  <rect class="bar" x="34" y="742" width="692" height="48" rx="4"/><text class="text" x="52" y="772">Advanced · 8 tham số · collapsed</text><text class="text" x="696" y="772">›</text>
  <rect class="button" x="34" y="818" width="100" height="38" rx="4"/><text class="small" x="50" y="842">Reset Draft</text>
  <rect class="button" x="144" y="818" width="84" height="38" rx="4"/><text class="small" x="163" y="842">Preview</text>
  <rect class="button" x="238" y="818" width="84" height="38" rx="4"/><text class="small" x="256" y="842">Validate</text>
  <rect class="primary" x="332" y="818" width="96" height="38" rx="4"/><text class="white" x="351" y="842">Calculate</text>
  <rect class="button" x="438" y="818" width="74" height="38" rx="4"/><text class="small" x="459" y="842">Apply</text>
  <rect class="button" x="522" y="818" width="74" height="38" rx="4"/><text class="small" x="542" y="842">Close</text>
</svg>
