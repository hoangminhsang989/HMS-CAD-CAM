  <text class="small" x="1034" y="210">Dao D10 · Profile kín · 1 cảnh báo</text>
  <rect class="surface" x="1020" y="238" width="400" height="246" rx="5"/>
  <text class="label" x="1034" y="264">Basic</text>
  <text class="small" x="1034" y="295">Profile</text><rect class="button" x="1168" y="276" width="232" height="30" rx="3"/><text class="text" x="1180" y="297">Biên dạng ngoài · đã chọn</text>
  <text class="small" x="1034" y="335">Dao</text><rect class="button" x="1168" y="316" width="232" height="30" rx="3"/><text class="text" x="1180" y="337">Dao phay ngón D10</text>
  <text class="small" x="1034" y="375">Chiều sâu cuối</text><rect class="button" x="1168" y="356" width="182" height="30" rx="3"/><text class="text" x="1180" y="377">-12.000</text><text class="small" x="1360" y="377">mm</text>
  <text class="small" x="1034" y="415">Bước xuống</text><rect class="button" x="1168" y="396" width="182" height="30" rx="3"/><text class="text" x="1180" y="417">2.000</text><text class="small" x="1360" y="417">mm</text>
  <text class="small" x="1034" y="455">Lượng chạy dao</text><rect class="button" x="1168" y="436" width="182" height="30" rx="3"/><text class="text" x="1180" y="457">650</text><text class="small" x="1360" y="457">mm/min</text>
  <rect class="bar" x="1020" y="494" width="400" height="42" rx="4"/><text class="text" x="1034" y="520">Geometry</text><text class="small" x="1380" y="520">›</text>
  <rect class="bar" x="1020" y="544" width="400" height="42" rx="4"/><text class="text" x="1034" y="570">Tool · từ Tool Library</text><text class="small" x="1380" y="570">›</text>
  <rect class="bar" x="1020" y="594" width="400" height="42" rx="4"/><text class="text" x="1034" y="620">Advanced · 8 tham số</text><text class="small" x="1380" y="620">›</text>
  <text class="small" x="1022" y="661">Diagnostics · Clearance phải lớn hơn Retract</text>
  <rect class="button" x="1020" y="678" width="88" height="34" rx="4"/><text class="small" x="1033" y="700">Reset Draft</text>
  <rect class="button" x="1116" y="678" width="72" height="34" rx="4"/><text class="small" x="1131" y="700">Preview</text>
  <rect class="button" x="1196" y="678" width="72" height="34" rx="4"/><text class="small" x="1210" y="700">Validate</text>
  <rect class="primary" x="1276" y="678" width="72" height="34" rx="4"/><text class="white" x="1288" y="700">Calculate</text>
  <rect class="button" x="1356" y="678" width="64" height="34" rx="4"/><text class="small" x="1374" y="700">Apply</text>

  <rect class="surface" x="0" y="728" width="1440" height="142"/>
  <text class="label" x="18" y="756">Diagnostics &amp; background tasks</text>
  <rect class="warn" x="18" y="772" width="610" height="38" rx="4"/><text class="text" x="32" y="796">⚠ Contour ngoài · Clearance 50 mm phải lớn hơn Retract 52 mm</text>
  <rect class="ok" x="642" y="772" width="360" height="38" rx="4"/><text class="text" x="656" y="796">✓ Pocket lòng khuôn · Toolpath CURRENT</text>
  <text class="small" x="18" y="840">1 cảnh báo · 0 lỗi · Không có tác vụ nền đang chạy</text>
  <text class="small" x="1280" y="840">Thu gọn panel ⌄</text>
  <rect class="primary" x="0" y="870" width="1440" height="30"/>
  <text class="white" x="16" y="891">Sẵn sàng · ĐỐI TƯỢNG: 1 · X 0.000 · Y 0.000 · Z 0.000 · MM · WCS G54</text>
</svg>
