<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe workspace chính HMS CAD/CAM</title>
  <desc id="desc">Bố cục ribbon theo ngữ cảnh, Operation Manager trái, viewport trung tâm, Function Editor phải và diagnostics dưới.</desc>
  <defs>
    <style>
      .bg{fill:#f3f5f7}.surface{fill:#fff;stroke:#c6cdd5;stroke-width:1}.bar{fill:#e9edf2;stroke:#c6cdd5}.primary{fill:#2463a5}.soft{fill:#e8f1fb;stroke:#8db4db}.ok{fill:#e7f5ed;stroke:#4b9a6c}.warn{fill:#fff4dc;stroke:#c88a24}.text{font:14px 'Segoe UI',Arial,sans-serif;fill:#202a33}.small{font:12px 'Segoe UI',Arial,sans-serif;fill:#5c6874}.label{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#202a33}.white{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#fff}.line{stroke:#aab4bf;stroke-width:1;fill:none}.dash{stroke:#9aa7b4;stroke-dasharray:6 5;fill:none}.button{fill:#fff;stroke:#9ca8b4}.viewport{fill:#dfe6ec;stroke:#aab4bf}.grid{stroke:#c8d1d9;stroke-width:1}.part{fill:#9fb5c7;stroke:#536b7c;stroke-width:2}.toolpath{fill:none;stroke:#2463a5;stroke-width:3}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="surface" x="0" y="0" width="1440" height="42"/>
  <text class="label" x="18" y="27">HMS CAD/CAM</text>
  <text class="text" x="170" y="27">Dự án: TRUC_MAY.HMS</text>
  <rect class="primary" x="1130" y="8" width="92" height="27" rx="4"/><text class="white" x="1151" y="27">CAM</text>
  <rect class="button" x="1230" y="8" width="92" height="27" rx="4"/><text class="text" x="1247" y="27">Simulation</text>
  <rect class="button" x="1330" y="8" width="92" height="27" rx="4"/><text class="text" x="1358" y="27">NC</text>

  <rect class="bar" x="0" y="42" width="1440" height="82"/>
  <text class="small" x="18" y="62">RIBBON THEO NGỮ CẢNH · OPERATION ĐANG CHỌN</text>
  <rect class="button" x="18" y="70" width="108" height="38" rx="4"/><text class="text" x="34" y="94">Chọn hình học</text>
  <rect class="button" x="136" y="70" width="92" height="38" rx="4"/><text class="text" x="157" y="94">Chọn dao</text>
  <rect class="button" x="238" y="70" width="94" height="38" rx="4"/><text class="text" x="260" y="94">Preview</text>
  <rect class="primary" x="342" y="70" width="104" height="38" rx="4"/><text class="white" x="364" y="94">Tính đường dao</text>
  <line class="line" x1="470" y1="58" x2="470" y2="112"/>
  <rect class="button" x="490" y="70" width="96" height="38" rx="4"/><text class="text" x="511" y="94">Mô phỏng</text>
  <rect class="button" x="596" y="70" width="84" height="38" rx="4"/><text class="text" x="622" y="94">Post</text>

  <rect class="surface" x="0" y="124" width="282" height="604"/>
  <text class="label" x="16" y="151">Operation Manager</text>
  <rect class="soft" x="10" y="164" width="262" height="34" rx="4"/><text class="text" x="22" y="186">▾ Project · TRUC_MAY</text>
  <text class="text" x="30" y="222">▾ Job · Khuôn trên</text>
  <text class="text" x="48" y="254">▾ Setup 1 · Máy phay 3 trục</text>
  <text class="small" x="68" y="284">Stock</text><circle cx="252" cy="280" r="6" fill="#2f855a"/>
  <text class="small" x="68" y="312">Tool Library · 5 dao</text>
  <text class="text" x="68" y="344">▾ Operations</text>
  <rect class="soft" x="58" y="354" width="204" height="38" rx="4"/>
  <circle cx="74" cy="373" r="6" fill="#b7791f"/><text class="text" x="88" y="378">Contour ngoài</text>
  <text class="small" x="84" y="414">Geometry</text><circle cx="250" cy="410" r="5" fill="#2f855a"/>
  <text class="small" x="84" y="440">Tool · Dao D10</text><circle cx="250" cy="436" r="5" fill="#2f855a"/>
  <text class="small" x="84" y="466">Toolpath · STALE</text><circle cx="250" cy="462" r="5" fill="#b7791f"/>
  <text class="small" x="84" y="492">Simulation · Chưa chạy</text>
  <text class="small" x="84" y="518">Post</text>
  <text class="text" x="68" y="554">Pocket lòng khuôn</text><circle cx="250" cy="550" r="6" fill="#2f855a"/>
  <text class="text" x="68" y="586">Drilling lỗ gá</text><circle cx="250" cy="582" r="6" fill="#b42318"/>
