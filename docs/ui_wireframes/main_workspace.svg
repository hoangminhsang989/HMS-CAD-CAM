  <text class="label" x="304" y="151">Graphics Viewport</text>
  <text class="small" x="882" y="151">TOP · MM · WCS G54</text>
  <line class="grid" x1="282" y1="620" x2="1002" y2="620"/><line class="grid" x1="380" y1="124" x2="380" y2="728"/>
  <path class="part" d="M430 310 L780 240 L895 375 L565 470 Z"/>
  <path class="toolpath" d="M450 330 C520 270 620 430 700 300 S830 280 870 375"/>
  <path class="toolpath" d="M470 355 C550 300 620 445 720 325 S820 315 850 390"/>
  <line x1="348" y1="660" x2="408" y2="660" stroke="#b42318" stroke-width="3"/><text class="small" x="412" y="665">X</text>
  <line x1="348" y1="660" x2="348" y2="600" stroke="#2f855a" stroke-width="3"/><text class="small" x="342" y="592">Y</text>
  <rect class="soft" x="304" y="172" width="205" height="32" rx="4"/><text class="small" x="316" y="193">Đang chọn: Contour ngoài</text>
  <text class="small" x="304" y="706">Overlay: geometry + draft preview · không sửa CAD nguồn</text>

  <rect class="surface" x="1002" y="124" width="438" height="604"/>
  <text class="label" x="1022" y="151">Function Editor</text>
