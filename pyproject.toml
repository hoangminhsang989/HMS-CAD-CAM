[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "hms-cadcam"
version = "0.1.0"
description = "Khung ung dung desktop HMS CAD/CAM"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cadquery-ocp-novtk==7.9.3.1.1",
    "PySide6==6.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
