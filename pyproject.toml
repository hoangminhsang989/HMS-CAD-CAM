[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "hms-cadcam"
version = "0.1.0"
description = "Khung ung dung desktop HMS CAD/CAM"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cadquery-ocp-novtk==7.9.3.1.1",
    "PySide6==6.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
]
qa = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "psutil==7.2.2",
    "pytest-xdist==3.8.0",
    "pytest-benchmark==5.2.3",
    "pywinauto==0.6.9; sys_platform == 'win32'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not benchmark and not windows_native'"
markers = [
    "gui: tests that exercise Qt widgets or the Qt event loop",
    "windows_native: optional tests that require an interactive Windows desktop",
    "serial: tests that must not share resources with concurrent pytest workers",
    "ocp: tests that load or exercise the Open CASCADE kernel",
    "benchmark: measurements reported for observation, never a hard pass/fail gate",
    "slow: tests that are intentionally slower than the quick QA selection",
    "filesystem: tests that create, export, recover, or inspect filesystem artifacts",
    "sqlite: tests that own a SQLite database lifecycle",
]
